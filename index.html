<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdade ou Desafio Online P2P</title>
    <!-- Importa o PeerJS para conexão P2P sem servidor -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #ffcc00;
            text-align: center;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 25px;
            text-align: center;
        }

        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .hidden {
            display: none !important;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1rem;
            text-align: center;
        }

        .btn {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        #gameScreen {
            max-width: 600px;
        }

        .room-info {
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #00ffcc;
        }

        .game-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        #bottle {
            width: 70px;
            height: 200px;
            cursor: pointer;
            transition: transform 3s cubic-bezier(0.15, 0.9, 0.2, 1);
            filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.5));
        }

        .result-card {
            background: rgba(40, 40, 60, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 90px;
        }

        .result-card h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #00ffcc;
        }

        .result-card p {
            font-size: 1rem;
            line-height: 1.4;
        }

        .players-list {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <!-- TELA 1: MENU INICIAL -->
    <div id="menuScreen" class="screen">
        <h1>Verdade ou Desafio</h1>
        <p class="subtitle">Sala Realtime P2P (Sem Servidor)</p>
        
        <input type="text" id="inputNome" placeholder="Seu Apelido" maxlength="15">
        <button class="btn" onclick="criarSala()">Criar Nova Sala</button>
        
        <p style="margin: 10px 0; color: #888; font-size: 0.9rem;">ou entre em uma:</p>
        
        <input type="text" id="inputCodigoSala" placeholder="Código da Sala">
        <button class="btn btn-secondary" onclick="entrarSala()">Entrar na Sala</button>
    </div>

    <!-- TELA 2: O JOGO -->
    <div id="gameScreen" class="screen hidden">
        <div class="room-info" id="roomCodeDisplay">Código da Sala: ...</div>
        
        <div class="game-container">
            <svg id="bottle" viewBox="0 0 100 300" onclick="tentarGirar()">
                <path d="M 35 70 L 35 270 Q 35 290 50 290 Q 65 290 65 270 L 65 70 Z" fill="#2ecc71" stroke="#27ae60" stroke-width="3"/>
                <rect x="38" y="130" width="24" height="80" fill="#ffffff" opacity="0.8" rx="4"/>
                <path d="M 42 30 L 42 70 L 58 70 L 58 30 Z" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
                <rect x="40" y="15" width="20" height="15" rx="3" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
            </svg>
        </div>

        <button id="btnGirar" class="btn btn-secondary" onclick="tentarGirar()">GIRAR A GARRAFA</button>

        <div id="resultCard" class="result-card">
            <h3 id="resultTitle">Aguardando jogada...</h3>
            <p id="resultText">Gire a garrafa para sortear uma Verdade ou Desafio!</p>
        </div>

        <div class="players-list" id="playersList">Conectados: 1</div>
    </div>

    <script>
        const verdades = [
            "Qual foi a coisa mais vergonhosa que você já fez na escola?",
            "Se você pudesse trocar de vida com alguém aqui por um dia, quem seria?",
            "Qual é o seu maior medo secreto?",
            "Qual foi a mentira mais bobá que você já contou para os seus pais?",
            "Quem foi a última pessoa que você stalkeou nas redes sociais?",
            "Qual é o hábito mais estranho que você tem quando está sozinho?"
        ];

        const desafios = [
            "Mande um áudio cantando o refrão de uma música no último grupo de WhatsApp que você abriu.",
            "Faça sua melhor imitação de algum famoso por 30 segundos.",
            "Fique sem falar até a sua próxima rodada.",
            "Mande a última foto da sua galeria no chat sem explicar nada.",
            "Faça 15 flexões ou agachamentos agora mesmo."
        ];

        let peer = null;
        let conexoes = []; 
        let conexaoUnica = null; 
        let meuNome = '';
        let ehHost = false;
        let anguloAtual = 0;
        let emGiro = false;
        let listaJogadores = [];

        function criarSala() {
            meuNome = document.getElementById('inputNome').value.trim() || "Anônimo";
            const idAleatorio = "vd-" + Math.random().toString(36).substring(2, 8);
            ehHost = true;
            listaJogadores = [meuNome];

            peer = new Peer(idAleatorio);

            peer.on('open', (id) => {
                document.getElementById('menuScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('roomCodeDisplay').textContent = `Código da Sala: ${id}`;
                atualizarListaJogadores();
            });

            peer.on('connection', (conn) => {
                conexoes.push(conn);

                conn.on('data', (dados) => {
                    if (dados.tipo === 'ENTRAR') {
                        if (!listaJogadores.includes(dados.nome)) {
                            listaJogadores.push(dados.nome);
                        }
                        sincronizarParaTodos({ tipo: 'ATUALIZAR_JOGADORES', jogadores: listaJogadores });
                    } else if (dados.tipo === 'GIRAR') {
                        executarGiroRemoto(dados.angulo, dados.titulo, dados.texto);
                        conexoes.forEach(c => {
                            if (c !== conn) {
                                c.send({ tipo: 'GIRAR', angulo: dados.angulo, titulo: dados.titulo, texto: dados.texto });
                            }
                        });
                    }
                });

                conn.on('close', () => {
                    conexoes = conexoes.filter(c => c !== conn);
                });
            });

            peer.on('error', (err) => {
                alert("Erro ao criar sala. Tente novamente.");
            });
        }

        function entrarSala() {
            meuNome = document.getElementById('inputNome').value.trim() || "Anônimo";
            const codigoSala = document.getElementById('inputCodigoSala').value.trim();

            if (!codigoSala) {
                alert("Digite o código da sala!");
                return;
            }

            ehHost = false;
            peer = new Peer();

            peer.on('open', () => {
                conexaoUnica = peer.connect(codigoSala);

                conexaoUnica.on('open', () => {
                    document.getElementById('menuScreen').classList.add('hidden');
                    document.getElementById('gameScreen').classList.remove('hidden');
                    document.getElementById('roomCodeDisplay').textContent = `Conectado na Sala`;

                    conexaoUnica.send({ tipo: 'ENTRAR', nome: meuNome });
                });

                conexaoUnica.on('data', (dados) => {
                    if (dados.tipo === 'ATUALIZAR_JOGADORES') {
                        listaJogadores = dados.jogadores;
                        atualizarListaJogadores();
                    } else if (dados.tipo === 'GIRAR') {
                        animarGarrafa(dados.angulo, dados.titulo, dados.texto);
                    }
                });

                conexaoUnica.on('error', (err) => {
                    alert("Erro ao conectar na sala. Verifique o código.");
                });
            });
        }

        function sincronizarParaTodos(dados) {
            atualizarListaJogadores();
            conexoes.forEach(conn => conn.send(dados));
        }

        function atualizarListaJogadores() {
            document.getElementById('playersList').textContent = `Jogadores na Sala: ${listaJogadores.join(', ')}`;
        }

        function tentarGirar() {
            if (emGiro) return;

            const tipo = Math.random() < 0.5 ? 'verdade' : 'desafio';
            let titulo = "", texto = "";
            if (tipo === 'verdade') {
                titulo = "🤔 VERDADE";
                texto = verdades[Math.floor(Math.random() * verdades.length)];
            } else {
                titulo = "🔥 DESAFIO";
                texto = desafios[Math.floor(Math.random() * desafios.length)];
            }

            const voltasExtras = Math.floor(Math.random() * 6) + 5;
            const anguloAleatorio = Math.floor(Math.random() * 360);
            anguloAtual += (voltasExtras * 360) + anguloAleatorio;

            if (ehHost) {
                executarGiroRemoto(anguloAtual, titulo, texto);
                conexoes.forEach(conn => {
                    conn.send({ tipo: 'GIRAR', angulo: anguloAtual, titulo: titulo, texto: texto });
                });
            } else {
                if (conexaoUnica && conexaoUnica.open) {
                    conexaoUnica.send({ tipo: 'GIRAR', angulo: anguloAtual, titulo: titulo, texto: texto });
                }
            }
        }

        function executarGiroRemoto(angulo, titulo, texto) {
            animarGarrafa(angulo, titulo, texto);
        }

        function animarGarrafa(angulo, titulo, texto) {
            emGiro = true;
            const btn = document.getElementById('btnGirar');
            const bottle = document.getElementById('bottle');
            const cardTitle = document.getElementById('resultTitle');
            const cardText = document.getElementById('resultText');

            btn.disabled = true;
            cardTitle.textContent = "Girando...";
            cardText.textContent = "A garrafa está rodando...";

            bottle.style.transform = `rotate(${angulo}deg)`;

            setTimeout(() => {
                emGiro = false;
                btn.disabled = false;
                cardTitle.textContent = titulo;
                cardText.textContent = texto;
            }, 3000);
        }
    </script>
</body>
</html>
